[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakebase"
version = "2.0.0"
description = "Gera bancos de dados falsos em NoSQL embutido e serve tudo por rotas CRUD."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Matheus Cezario" }]
keywords = ["fake data", "mock api", "nosql", "rest", "fixtures"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "click>=8.1",
  "faker>=19.0",
  "fastapi>=0.110",
  "montydb>=2.5",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
fakebase = "fakebase.cli:main"

[project.urls]
Repository = "https://github.com/Matheus-Cezario/FakeBase"

[tool.setuptools.packages.find]
include = ["fakebase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
